<!DOCTYPE html>
<html>
<head>
<title>Inventario de Tienda</title>
</head>
<body>

<h1>Sistema de Inventario</h1>

<h2>Registro de productos</h2>

<form id="formulario-producto">
	<label for="nombre-producto">Nombre del producto:</label>
	<input id="nombre-producto" name="nombre" type="text" required>

	<br><br>

	<label for="cantidad-producto">Cantidad:</label>
	<input id="cantidad-producto" name="cantidad" type="number" min="1" step="1" required>

	<br><br>

	<button type="submit">Registrar producto</button>
</form>

<h2>Listado de productos</h2>

<table border="1">
<tr>
<th>Producto</th>
<th>Cantidad</th>
</tr>

<tbody id="lista-productos">
	<tr>
		<td>Computador</td>
		<td>10</td>
	</tr>
	<tr>
		<td>Mouse</td>
		<td>20</td>
	</tr>
</tbody>
</table>

<script src="productos.js" defer></script>
</body>
</html>
